name: Push build into production

on:
  push:
    branches: ['main']

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: SFTP connectivity preflight
        continue-on-error: true
        run: |
          echo "Checking DNS resolution for SFTP host"
          getent hosts "${{ secrets.SFTP_HOST }}" || true
          echo "Checking TCP connectivity to ${{ secrets.SFTP_HOST }}:${{ secrets.SFTP_PORT }}"
          timeout 15 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.SFTP_HOST }}/${{ secrets.SFTP_PORT }}" && echo "TCP port reachable" || echo "TCP port NOT reachable"

      - name: Upload dist via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT }} # default 22
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }} # remove if using SSH key
          # ssh_private_key: ${{ secrets.SFTP_KEY }} # uncomment for key-based auth
          local_path: './dist/*'
          remote_path: './public/docroot/modelab/'
          sftp_only: true
          sftpArgs: '-vvv'
